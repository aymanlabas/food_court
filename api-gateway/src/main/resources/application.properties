server.port=8080
spring.application.name=api-gateway

# Configuration centralisee (les valeurs ci-dessous permettent aussi un demarrage autonome)
spring.config.import=optional:configserver:http://localhost:8888

# Enregistrement dans Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Routage dynamique via Eureka et Load Balancer (lb://)
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.routes[0].id=service-commandes
spring.cloud.gateway.routes[0].uri=lb://service-commandes
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.routes[1].id=service-notification
spring.cloud.gateway.routes[1].uri=lb://service-notification
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/notifications/**

spring.cloud.gateway.routes[2].id=service-usagers
spring.cloud.gateway.routes[2].uri=lb://service-usagers
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/usagers/**

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=when-authorized