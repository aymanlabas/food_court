server.port=8080
spring.application.name=api-gateway

# Enregistrement dans Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Routage dynamique vers service-commandes via Load Balancer (lb://)
spring.cloud.gateway.routes[0].id=service-commandes
spring.cloud.gateway.routes[0].uri=lb://service-commandes
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/orders/**