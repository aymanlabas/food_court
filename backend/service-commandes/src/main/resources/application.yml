server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: service-commandes

  datasource:
    url: ${DB_COMMANDES_URL:jdbc:postgresql://localhost:5432/db_commandes}
    username: ${DB_COMMANDES_USERNAME:postgres}
    password: ${DB_COMMANDES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: service-commandes-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

services:
  service-menu:
    url: ${SERVICE_MENU_URL:http://service-menu:8081}
  service-usagers:
    url: ${SERVICE_USAGERS_URL:http://service-usagers:8083}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.foodcourt.commandes: ${LOG_LEVEL:INFO}
    org.springframework.web: INFO

---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: ${DB_COMMANDES_URL}
    username: ${DB_COMMANDES_USERNAME}
    password: ${DB_COMMANDES_PASSWORD}

services:
  service-menu:
    url: ${SERVICE_MENU_URL}
  service-usagers:
    url: ${SERVICE_USAGERS_URL}

