server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: service-menu

  datasource:
    url: ${DB_MENU_URL:jdbc:postgresql://localhost:5432/db_menu}
    username: ${DB_MENU_USERNAME:postgres}
    password: ${DB_MENU_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    com.foodcourt.menu: ${LOG_LEVEL:INFO}
    org.springframework.web: INFO

---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: ${DB_MENU_URL}
    username: ${DB_MENU_USERNAME}
    password: ${DB_MENU_PASSWORD}

logging:
  level:
    com.foodcourt.menu: INFO
