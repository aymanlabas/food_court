server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: service-notification

  datasource:
    url: ${DB_NOTIFICATION_URL:jdbc:postgresql://localhost:5432/db_notification}
    username: ${DB_NOTIFICATION_USERNAME:postgres}
    password: ${DB_NOTIFICATION_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: service-notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.foodcourt.notification: ${LOG_LEVEL:INFO}
    org.springframework.web: INFO

---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: ${DB_NOTIFICATION_URL}
    username: ${DB_NOTIFICATION_USERNAME}
    password: ${DB_NOTIFICATION_PASSWORD}

