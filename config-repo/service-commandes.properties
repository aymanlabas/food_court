foodcourt.message.bienvenue=Bienvenue sur le service commandes Food Court!
foodcourt.devise=MAD
server.port=8081
spring.datasource.url=jdbc:h2:mem:commandesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
springdoc.override-with-generic-response=false
spring.cloud.openfeign.circuitbreaker.enabled=true

# Configuration RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ==========================================
# JALON V6 : FEIGN TIMEOUTS & RESILIENCE4J
# ==========================================

# 1. Delais d'attente Feign (Timeouts en ms)
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000
spring.cloud.openfeign.client.config.default.logger-level=basic

# 2. Circuit Breaker
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
resilience4j.circuitbreaker.configs.default.sliding-window-size=5
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=3
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.configs.default.ignore-exceptions=com.foodcourt.service_commandes.exceptions.ResourceNotFoundException

# 3. TimeLimiter
resilience4j.timelimiter.configs.default.timeout-duration=3s
