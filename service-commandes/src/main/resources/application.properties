server.port=8081
spring.application.name=service-commandes

# Connexion au Config Server
spring.config.import=optional:configserver:http://localhost:8888

# Configuration PostgreSQL (Docker)
spring.datasource.url=jdbc:postgresql://localhost:5433/foodcourt_commandes_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

springdoc.override-with-generic-response=false

# Configuration Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Activation du Circuit Breaker sur OpenFeign
spring.cloud.openfeign.circuitbreaker.enabled=true